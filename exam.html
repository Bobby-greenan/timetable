<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bobby's exam timetable">
    <title>Bobby's Exam Timetable</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            color: #000000;
            background-color: #ffffff;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        .timetable-navigation {
            display: inline-block;
            padding: 10px 14px;
            border: 1px solid #000000;
            border-radius: 4px;
            background-color: #f2f2f2;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
        }

        .timetable-navigation:hover,
        .timetable-navigation:focus {
            background-color: #e0e0e0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1200px;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #000000;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            word-wrap: break-word;
        }

        th {
            background-color: #ffffff;
        }

        .room {
            font-size: 13px;
            color: #444444;
        }

        @media (max-width: 700px) {
            .table-wrapper {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="page-header">
            <div>
                <h1>Bobby's Exam Timetable</h1>
            </div>
            <a class="timetable-navigation" href="index.html">Standard Timetable</a>
        </header>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Monday<br>9th Nov</th>
                        <th scope="col">Tuesday<br>10th Nov</th>
                        <th scope="col">Wednesday<br>11th Nov</th>
                        <th scope="col">Thursday<br>12th Nov</th>
                        <th scope="col">Friday<br>13th Nov</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>English<br><span class="room">Room 23</span></td>
                        <td>Physics<br><span class="room">Room 24</span></td>
                        <td>Economics<br><span class="room">Room 23</span></td>
                        <td>Gaeilge<br><span class="room">Room 21</span></td>
                        <td>Maths<br><span class="room">Room 21</span></td>
                    </tr>
                    <tr>
                        <td><br></td>
                        <td>French<br><span class="room">Room 25</span></td>
                        <td></td>
                        <td></td>
                        <td>DCG<br><span class="room">Room 23</span></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>Applied Maths<br><span class="room">Room 23</span></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
